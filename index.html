<style>.pills{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}.pill{border:1px solid var(--line);background:#fff;color:var(--txt);border-radius:999px;padding:7px 16px;font:600 13px Inter,system-ui;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.06);transition:all .15s}.pill:hover{transform:translateY(-1px);box-shadow:0 3px 8px rgba(30,58,138,.18)}.pill.on{background:var(--gold);color:#fff;border-color:var(--gold)}@media(max-width:600px){.pill{padding:6px 12px;font-size:12px}}.byw{display:flex;gap:16px;align-items:flex-start}.byw>.scroll{flex:1 1 auto;min-width:0}.byc{flex:0 0 460px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}@media(max-width:1000px){.byw{flex-direction:column}.byc{flex-basis:auto;width:100%}}

<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pw){const e=await (await fetch('data.enc.json',{cache:'no-store'})).json();
 const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);

const $=id=>document.getElementById(id);
const fm=v=>(v<0?'-':'')+'$'+Math.abs(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});

 (function f(t){const p=Math.min(1,(t-t0)/1500),e=1-Math.pow(1-p,3);el.textContent=sgn(v*e);if(p<1)requestAnimationFrame(f);else el.textContent=sgn(v);})(t0);}
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
function render(d){
 const om=d.options_monthly,netP=sum(om,x=>x.put),netC=sum(om,x=>x.call),S=d.div_schwab||{},div=S.div,int=S.int,wh=sum(d.div_by_month,x=>x.withheld);
 const Y=d.years||[],aS=sum(Y,x=>x.stocks),aO=sum(Y,x=>x.options),aD=sum(Y,x=>x.divint),aT=aS+aO+aD;
 count($('ytd'),aT);$('hero').innerHTML=[['Stocks','hS',aS],['Options','hO',aO],['Dividends + Interest','hD',aD]].map(([l,id])=>`<div class="card"><div class="l">${l}</div><div class="v" id="${id}"></div></div>`).join('');
 count($('hS'),aS);count($('hO'),aO);count($('hD'),aD);
 const ns=Y.filter(x=>x.has&&!x.split&&x.stocks).map(x=>x.year);
 table('tYr',['Year','Stocks','Options','Trading Only','Div + Interest','Total'],Y.map(x=>[String(x.year)+(x.proj?' (div = Schwab projected)':''),x.stocks,x.options,x.stocks+x.options,x.divint,x.stocks+x.options+x.divint]),['ALL-TIME',aS,aO,aS+aO,aD,aT]);const drawC=s=>{if(d.realized_chart)$('yrChart').innerHTML='<h3 style="margin:0 0 6px;font-size:13px;color:var(--muted)">REALIZED GAINS / LOSSES BY YEAR</h3>'+rbar(d.realized_chart,s);};drawC(null);

 const mv=sum(d.positions,x=>x.mv),cost=sum(d.positions,x=>x.cost);
 $('cards2').innerHTML=[['Net puts',netP],['Net calls',netC],['Dividends (gross)',div],['Interest',int],['Tax withheld (Jul–Oct)',wh],['Portfolio value',mv],['Unrealized P/L',mv-cost],['Short put premium open',sum(d.short_puts,x=>x.prem)]]
  .map(([l,v])=>`<div class="card"><div class="l">${l}</div><div class="v ${cl(v)}">${fm(v)}</div></div>`).join('');

 new Chart($('cOpt'),{type:'bar',data:{labels:om.map(x=>mname(x.month)),datasets:[{label:'Puts',data:om.map(x=>x.put),backgroundColor:'#1e3a8a'},{label:'Calls',data:om.map(x=>x.call),backgroundColor:'#60a5fa'}]}});
 if(d.top_wl){const T=d.top_wl,bx=(t,a)=>`<div class="card" style="border-radius:14px;padding:14px"><div class="l">${t}</div>${a.map((x,i)=>`<div style="display:flex;justify-content:space-between;font:600 16px Inter;padding:6px 0;border-bottom:1px solid #eef"><span>${i+1}. ${x[0]}</span><span class="${cl(x[1])}">${sgn(x[1])}</span></div>`).join('')}</div>`;$('wl').innerHTML=bx('Top 3 Winners '+T.year,T.win)+bx('Top 3 Losers '+T.year,T.lose);}
 if(d.stocks_annual){const A=d.stocks_annual,aG=sum(A,x=>x.gl||0);
  table('tStkY',['Year','Realized Gain/Loss'],A.map(x=>[String(x.year)+(x.note.startsWith('Includes')?' †':''),x.gl==null?'—':x.gl]),['ALL-TIME',aG]);
  $('tStkY').insertAdjacentHTML('beforeend','<div class="muted" style="font-size:11px;margin-top:6px">Short- and long-term combined. † 2018 and 2025 include options (not split). 2017 and 2019: no data.</div>');
  $('stkChart').innerHTML='<h3 style="margin:0 0 6px;font-size:13px;color:var(--muted)">STOCK REALIZED G/L BY YEAR</h3>'+rbar(A.filter(x=>x.gl!=null).map(x=>({year:x.year,val:x.gl})),null);
  const T=d.stocks_2026;table('tStkT',['Ticker','Name','Lots','Realized Gain/Loss'],T.map(x=>[x.t,x.n,String(x.lots),x.gl]),['TOTAL','',String(sum(T,x=>x.lots)),sum(T,x=>x.gl)]);}
 const dm0=d.div_by_month,dm=[{lab:'Jan–Jun (Schwab, not itemized)',div:S.janjun_div,interest:S.janjun_int,withheld:null}].concat(dm0.map(x=>({lab:mname(x.month),div:x.div+x.interest,interest:0,withheld:x.withheld})));
 table('tDivM',['Month','Dividends','Interest','Withheld','Net'],dm.map(x=>[x.lab,x.div,x.interest,x.withheld==null?'—':x.withheld,x.div+x.interest+(x.withheld||0)]).concat([['Est. remaining Nov–Dec (Schwab est., not in total)',S.est,0,'—',S.est]]),['TOTAL (Schwab YTD 10/15)',div,int,wh,div+int+wh]);

 new Chart($('cDiv'),{type:'bar',data:{labels:dm.map(x=>x.lab.startsWith('Jan')?'Jan–Jun':x.lab).concat(['Nov–Dec est.']),datasets:[{label:'Dividends',data:dm.map(x=>x.div).concat([null]),backgroundColor:'#22c55e'},{label:'Interest',data:dm.map(x=>x.interest).concat([null]),backgroundColor:'#86efac'},{label:'Est. remaining',data:dm.map(()=>null).concat([S.est]),backgroundColor:'#cbd5e1'}]},options:{scales:{x:{stacked:true},y:{stacked:true}}}});

/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,

(function(){

  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;

    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
